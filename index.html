<!doctype html>
<html lang="lo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10253a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/jnlaosjnlaoscars-arch/jn-lao-cars-inventory/main/714423677_1410535111093249_29523217133627181_n-Photoroom.png">
  <title>JN LAO CARS</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:linear-gradient(145deg,#071a2d,#1e527f);font-family:system-ui,-apple-system,"Noto Sans Lao",sans-serif;color:white}.card{width:min(88vw,370px);padding:34px 28px;border:1px solid #ffffff2c;border-radius:26px;text-align:center;background:#ffffff12;box-shadow:0 22px 60px #0005;backdrop-filter:blur(12px)}.mark{width:76px;height:76px;margin:0 auto 18px;border-radius:22px;background:#fff;display:grid;place-items:center;color:#10253a;font-size:34px;box-shadow:0 9px 22px #0003}h1{font-size:25px;margin:0 0 5px}p{margin:0;color:#d8e7f5;line-height:1.7;font-size:14px}.dot{display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:99px;background:#79d8a5;animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.35;transform:scale(.7)}}a{display:block;margin-top:24px;padding:13px 16px;border-radius:13px;background:white;color:#10253a;font-weight:800;text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">🚘</div>
    <h1>JN LAO CARS</h1>
    <p><span class="dot"></span>ຕິດຕັ້ງໜ້ານີ້ເປັນແອັບ ແລ້ວເປີດຄັງລົດໄດ້ທັນທີ</p>
    <a id="open" href="https://jnlaosjnlaoscars-arch.github.io/jn-lao-cars-inventory/?app=mobile">ເປີດຄັງລົດ</a>
  </main>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js');
  </script>
</body>
</html>
